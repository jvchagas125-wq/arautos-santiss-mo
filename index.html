<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Adoração ao Santíssimo</title>
<meta name="description" content="Agende seu horário de adoração ao Santíssimo Sacramento." />
<link rel="icon" href="assets/favicon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7a0c1e" />
<link rel="apple-touch-icon" href="assets/icone-app-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="tela-fundo">

  <div class="overlay" id="overlay"></div>

  <!-- Menu lateral (hambúrguer) -->
  <aside class="menu-lateral" id="menuLateral">
    <div class="menu-lateral__topo">
      <img src="assets/logo.png" alt="Arautos do Evangelho" class="js-logo" />
      <button class="menu-lateral__fechar" id="btnFecharMenu" aria-label="Fechar menu">&times;</button>
    </div>
    <nav>
      <a href="/" data-pagina="index"><span class="emoji">🏠</span> Início</a>
      <a href="agendamento" data-pagina="agendamento"><span class="emoji">📅</span> Agendar horário</a>
      <a href="meus-agendamentos" data-pagina="meus-agendamentos"><span class="emoji">🗓️</span> Meus agendamentos</a>
      <a href="intencoes" data-pagina="intencoes"><span class="emoji">🙏</span> Intenções da missa</a>
      <a href="avisos" data-pagina="avisos"><span class="emoji">📢</span> Avisos</a>
      <a href="contatos" data-pagina="contatos"><span class="emoji">📍</span> Contatos</a>
      <a href="sobre" data-pagina="sobre"><span class="emoji">ℹ️</span> Sobre</a>
    </nav>
    <div class="menu-lateral__rodape">
      <a href="admin" class="menu-lateral__admin-btn"><span class="emoji">🔐</span> Painel administrativo</a>
    </div>
  </aside>

  <!-- Cabeçalho -->
  <header class="topbar">
    <button class="topbar__btn topbar__menu" id="btnMenu" aria-label="Abrir menu">
      <span class="icone-hamburguer"><span></span><span></span><span></span></span>
    </button>
    <img src="assets/logo.png" alt="Arautos do Evangelho" class="topbar__logo js-logo" />
    <button class="topbar__btn topbar__perfil" id="btnPerfil" aria-label="Meu perfil">
      <svg class="icone-perfil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/>
      </svg>
    </button>
  </header>

  <!-- Dropdown de perfil -->
  <div class="dropdown-perfil" id="dropdownPerfil">
    <div class="dropdown-perfil__avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/>
      </svg>
    </div>
    <div class="dropdown-perfil__nome" id="perfilNome">—</div>
    <div class="dropdown-perfil__tel" id="perfilTelefone">—</div>
    <hr/>
    <a href="meus-agendamentos">🗓️ Meus agendamentos</a>
    <button id="btnSair">🚪 Sair</button>
  </div>

  <!-- Conteúdo -->
  <main class="conteudo">
    <!-- Enquanto não há banners cadastrados em Configurações > Banners, mostra a logo e o
         título de sempre. Assim que o primeiro banner é cadastrado, isso é escondido e dá
         lugar ao carrossel (ver js/main.js). -->
    <div id="heroEstatico">
      <img class="selo-decorativo" src="assets/selo-adoracao.png" alt="" />
      <h1 class="titulo-pagina">Adoração ao Santíssimo Sacramento</h1>
      <div class="linha-ornamento"><img src="assets/cruz-ornamento.png" alt="" /></div>
    </div>

    <!-- Carrossel de banners da Home, preenchido dinamicamente pelo js/main.js a partir dos
         banners cadastrados no painel admin (Configurações > Banners da página inicial). -->
    <div class="carrossel-banners oculto" id="carrosselBanners">
      <div class="carrossel-banners__viewport">
        <div class="carrossel-banners__pista" id="carrosselPista"></div>
        <button type="button" class="carrossel-banners__seta carrossel-banners__seta--esq" id="carrosselAnterior" aria-label="Banner anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button type="button" class="carrossel-banners__seta carrossel-banners__seta--dir" id="carrosselProximo" aria-label="Próximo banner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="carrossel-banners__pontos" id="carrosselPontos"></div>
    </div>

    <div class="card-frase">
      <div class="card-frase__eyebrow">Frase do dia</div>
      <div class="skeleton-frase" id="fraseSkeleton">
        <div class="skeleton-linha"></div><div class="skeleton-linha"></div><div class="skeleton-linha"></div>
      </div>
      <blockquote id="fraseTexto" class="oculto"></blockquote>
      <cite id="fraseAutor" class="oculto"></cite>
    </div>

    <p class="pergunta-dia">Já visitou Nosso Senhor Jesus Cristo hoje?</p>
    <a href="agendamento" class="btn btn-dourado">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Agende seu horário
    </a>

    <p class="rodape-simples">Arautos do Evangelho Campos - RJ</p>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/instalar-app.js"></script>
</body>
</html>
