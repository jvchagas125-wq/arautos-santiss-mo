<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adoração ao Santíssimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#fbf3ec;
    --surface:#ffffff;
    --ink:#2a1210;
    --ink-soft:#7a5b53;
    --line:rgba(58,4,3,.14);
    --red-bright:#8a0f04;
    --red-deep:#3a0403;
    --gold:#a97a2f;
    --gold-soft:#f1e3c6;
    --full-bg:#efe6e0;
    --full-ink:#a3908a;
    --danger:#a2321f;
    --danger-bg:#fbeae6;
    --focus:#a97a2f;
    --shadow:0 18px 40px -20px rgba(58,4,3,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#170a09;
      --bg-soft:#221110;
      --surface:#261311;
      --ink:#f3e7e0;
      --ink-soft:#c9a99f;
      --line:rgba(233,211,183,.16);
      --red-bright:#c8422a;
      --red-deep:#7c1208;
      --gold:#d8ac5c;
      --gold-soft:#4a3418;
      --full-bg:#32201d;
      --full-ink:#8d746c;
      --danger:#e2604a;
      --danger-bg:#3a1a15;
      --focus:#d8ac5c;
      --shadow:0 18px 40px -20px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#170a09;
    --bg-soft:#221110;
    --surface:#261311;
    --ink:#f3e7e0;
    --ink-soft:#c9a99f;
    --line:rgba(233,211,183,.16);
    --red-bright:#c8422a;
    --red-deep:#7c1208;
    --gold:#d8ac5c;
    --gold-soft:#4a3418;
    --full-bg:#32201d;
    --full-ink:#8d746c;
    --danger:#e2604a;
    --danger-bg:#3a1a15;
    --focus:#d8ac5c;
    --shadow:0 18px 40px -20px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Lora',ui-serif,Georgia,serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.font-display{font-family:'Cinzel',ui-serif,serif;letter-spacing:.02em;text-wrap:balance;}
  .font-ui{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .hero{
    position:relative;
    overflow:hidden;
    padding:3.2rem 1.5rem 3.6rem;
    background:linear-gradient(160deg, var(--red-bright) 0%, var(--red-deep) 78%);
    color:#fbe9d8;
    text-align:center;
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-30%; right:-15%;
    width:70vmin;height:70vmin;
    background:
      repeating-conic-gradient(from 0deg, rgba(241,227,198,.16) 0deg 3deg, transparent 3deg 18deg);
    border-radius:50%;
    filter:blur(1px);
    opacity:.55;
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.28), transparent 60%);
    pointer-events:none;
  }
  .hero-inner{position:relative;max-width:640px;margin:0 auto;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.72rem;
    color:var(--gold-soft, #f1e3c6);
    opacity:.85;
    margin:0 0 .9rem;
  }
  .hero h1{
    margin:0 0 .7rem;
    font-size:clamp(1.6rem,4.4vw,2.5rem);
    color:#fff;
  }
  .hero .subtitle{
    margin:0;
    font-size:1.02rem;
    color:#f4e2d3;
    font-style:italic;
  }

  .wrap{max-width:760px;margin:0 auto;padding:1.6rem 1.25rem 4rem;}

  .legend{
    display:flex;flex-wrap:wrap;gap:.9rem;
    justify-content:center;
    margin:0 0 1.6rem;
    font-family:'Inter',sans-serif;
    font-size:.78rem;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex;align-items:center;gap:.4rem;}
  .legend i{width:.7rem;height:.7rem;border-radius:3px;display:inline-block;}
  .legend i.avail{background:var(--surface);border:1.5px solid var(--red-bright);}
  .legend i.full{background:var(--full-bg);border:1.5px solid var(--full-bg);}
  .legend i.closed{background:transparent;border:1.5px dashed var(--line);}

  .day-strip{
    display:flex;gap:.55rem;overflow-x:auto;padding:.3rem .1rem 1rem;
    scrollbar-width:thin;
  }
  .day-chip{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:14px;
    padding:.55rem .9rem;
    text-align:center;
    line-height:1.25;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .day-chip strong{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .day-chip span{display:block;font-size:.98rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .day-chip.selected{
    background:var(--red-bright);
    border-color:var(--red-bright);
    color:#fff;
  }
  .day-chip.selected strong{color:rgba(255,255,255,.8);}
  .day-chip:hover{transform:translateY(-1px);}

  .day-heading{
    font-family:'Inter',sans-serif;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin:0 0 .8rem;
  }

  .slot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(108px,1fr));
    gap:.65rem;
  }
  .slot{
    font-family:'Inter',sans-serif;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:.65rem .5rem;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .slot .t{display:block;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .slot .s{display:block;font-size:.68rem;margin-top:.2rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .slot.avail{border-color:var(--red-bright);}
  .slot.avail:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .slot.avail .s{color:var(--red-bright);}
  .slot.full{background:var(--full-bg);color:var(--full-ink);border-color:var(--full-bg);cursor:not-allowed;}
  .slot.full .s{color:var(--full-ink);}
  .slot.closed{opacity:.45;border-style:dashed;cursor:not-allowed;}
  .empty-state{
    text-align:center;color:var(--ink-soft);font-style:italic;padding:2rem 1rem;
  }
  .readonly-banner{
    margin-top:1.5rem;
    padding:.85rem 1rem;
    background:var(--danger-bg);
    color:var(--danger);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:.88rem;
    text-align:center;
  }

  .site-footer{
    max-width:760px;margin:0 auto;padding:1rem 1.25rem 3rem;
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    font-family:'Inter',sans-serif;font-size:.76rem;color:var(--ink-soft);
  }
  .admin-trigger{
    position:fixed;right:1rem;bottom:1rem;
    width:44px;height:44px;border-radius:50%;
    background:var(--surface);border:1.5px solid var(--line);
    color:var(--ink-soft);font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    z-index:40;
  }
  .admin-trigger:hover{color:var(--red-bright);border-color:var(--red-bright);}

  .overlay{
    position:fixed;inset:0;background:rgba(20,6,4,.5);
    display:flex;align-items:center;justify-content:center;
    padding:1rem;z-index:100;
  }
  .modal-card{
    width:100%;max-width:420px;background:var(--surface);
    border-radius:18px;padding:1.6rem;box-shadow:var(--shadow);
    max-height:88vh;overflow-y:auto;
  }
  .modal-card h2{margin:0 0 .3rem;font-size:1.25rem;}
  .modal-slot-label{
    font-family:'Inter',sans-serif;color:var(--gold);font-weight:600;
    margin:0 0 1.1rem;font-size:.92rem;
  }
  label.field{display:block;margin-bottom:1rem;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--ink-soft);}
  label.field input, label.field select{
    display:block;width:100%;margin-top:.35rem;
    padding:.65rem .75rem;border-radius:9px;border:1.5px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:.98rem;font-family:'Inter',sans-serif;
  }
  label.field input:focus, label.field select:focus{border-color:var(--focus);}
  .field-error{color:var(--danger);font-size:.76rem;margin-top:.3rem;display:none;}
  .field-error.show{display:block;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;
    border-radius:10px;padding:.7rem 1.1rem;border:1.5px solid transparent;
  }
  .btn.primary{background:var(--red-bright);color:#fff;}
  .btn.primary:hover{background:var(--red-deep);}
  .btn.primary:disabled{opacity:.6;cursor:wait;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{border-color:var(--ink-soft);}
  .btn.small{padding:.4rem .7rem;font-size:.78rem;}
  .btn.block{width:100%;}
  .modal-actions{display:flex;gap:.7rem;justify-content:flex-end;margin-top:.4rem;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(20,6,4,.45);z-index:90;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(440px,100vw);
    background:var(--surface);box-shadow:-18px 0 40px -20px rgba(0,0,0,.4);
    z-index:95;overflow-y:auto;padding:1.5rem 1.5rem 3rem;
  }
  .drawer h2{font-size:1.2rem;margin:.2rem 0 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
  .drawer h3{
    font-family:'Inter',sans-serif;font-size:.76rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-soft);margin:1.8rem 0 .8rem;
  }
  .drawer h3:first-of-type{margin-top:0;}
  .hours-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;font-family:'Inter',sans-serif;}
  .hour-check{
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);border-radius:8px;padding:.4rem 0;
    font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-soft);
  }
  .hour-check input{accent-color:var(--red-bright);margin-right:.3rem;}
  .hour-check.on{border-color:var(--red-bright);color:var(--ink);}
  .row-actions{display:flex;gap:.6rem;margin:.7rem 0;}
  .booking-day{margin-bottom:1.1rem;}
  .booking-day > strong{font-family:'Inter',sans-serif;font-size:.82rem;color:var(--ink-soft);}
  .booking-row{
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    padding:.55rem 0;border-bottom:1px solid var(--line);
    font-family:'Inter',sans-serif;font-size:.86rem;
  }
  .booking-row .who{display:flex;flex-direction:column;}
  .booking-row .who a{color:var(--ink-soft);text-decoration:none;font-size:.78rem;}
  .booking-row .time{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;min-width:3.4rem;}
  .no-bookings{color:var(--ink-soft);font-style:italic;font-size:.86rem;}
  .close-x{background:none;border:none;font-size:1.3rem;color:var(--ink-soft);line-height:1;}
  .login-box{display:flex;flex-direction:column;gap:.9rem;}
  .drawer-note{font-family:'Inter',sans-serif;font-size:.78rem;color:var(--ink-soft);margin-top:.4rem;}

  .toast{
    position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);
    font-family:'Inter',sans-serif;font-size:.86rem;
    padding:.75rem 1.2rem;border-radius:999px;box-shadow:var(--shadow);
    z-index:200;max-width:90vw;text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  var STATE = { config: null, counts: {}, loaded: false, loadError: false };
  var ui = {
    selectedDay: null, modalSlot: null, adminOpen: false,
    token: sessionStorage.getItem('admToken') || null,
    adminAuthed: !!sessionStorage.getItem('admToken'),
    adminBookings: null,
    busy: false
  };

  // ---------------- date helpers ----------------
  function pad2(n){ return String(n).padStart(2,'0'); }
  function parseKey(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function toKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  var WEEKDAYS = ['dom','seg','ter','qua','qui','sex','sáb'];
  var WEEKDAYS_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  function listDays(){
    if (!STATE.config) return [];
    var start = parseKey(STATE.config.startDate);
    var end = parseKey(STATE.config.endDate);
    var days = [];
    if (end < start) return days;
    var cur = start, guard = 0;
    while (cur <= end && guard < 400){ days.push(new Date(cur)); cur = addDays(cur,1); guard++; }
    return days;
  }
  function now(){ return new Date(); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- API ----------------
  function api(path, body){
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function(r){
      return r.json().then(function(data){ return { status: r.status, data: data }; });
    });
  }
  function loadState(){
    return fetch('/api/state').then(function(r){ return r.json(); }).then(function(data){
      STATE.config = data.config;
      STATE.counts = data.counts || {};
      STATE.loaded = true;
      STATE.loadError = false;
    }).catch(function(){
      STATE.loadError = true;
    }).then(render);
  }

  // ---------------- toast ----------------
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 4200);
  }

  // ---------------- phone mask ----------------
  function maskPhone(v){
    var d = v.replace(/\D/g,'').slice(0,11);
    if (d.length > 10) return d.replace(/(\d{2})(\d{5})(\d{0,4})/, function(m,a,b,c){ return '(' + a + ') ' + b + (c? '-'+c : ''); });
    if (d.length > 5) return d.replace(/(\d{2})(\d{4})(\d{0,4})/, function(m,a,b,c){ return '(' + a + ') ' + b + (c? '-'+c : ''); });
    if (d.length > 2) return d.replace(/(\d{2})(\d{0,5})/, function(m,a,b){ return '(' + a + ') ' + b; });
    return d;
  }

  function fv(form, field){
    var el = form.elements.namedItem(field);
    return el ? el.value : '';
  }

  // ---------------- rendering ----------------
  function renderDayStrip(days, todayD){
    if (!days.length) return '';
    return '<nav class="day-strip" id="dayStrip">' + days.map(function(d){
      var key = toKey(d);
      var sel = (key === ui.selectedDay) ? ' selected' : '';
      var isToday = sameDay(d, todayD);
      return '<button type="button" class="day-chip' + sel + '" data-day="' + key + '">' +
        '<strong>' + WEEKDAYS[d.getDay()] + (isToday ? ' • hoje' : '') + '</strong>' +
        '<span>' + pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '</span>' +
      '</button>';
    }).join('') + '</nav>';
  }

  function renderSlotGrid(selectedDate, todayD){
    var hours = (STATE.config.activeHours || []).slice().sort(function(a,b){return a-b;});
    if (!hours.length){
      return '<p class="empty-state">Nenhum horário foi habilitado ainda. Volte em breve.</p>';
    }
    var dayKey = toKey(selectedDate);
    var isToday = sameDay(selectedDate, todayD);
    var startOfToday = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());
    var isFullyPastDay = selectedDate < startOfToday;
    var curHour = todayD.getHours();
    var capacity = STATE.config.capacity || 1;
    var cells = hours.map(function(h){
      var slotKey = dayKey + '|' + pad2(h);
      var count = STATE.counts[slotKey] || 0;
      var past = isFullyPastDay || (isToday && h < curHour);
      var full = count >= capacity;
      var label = pad2(h) + ':00';
      if (past){
        return '<button type="button" class="slot closed" disabled><span class="t">' + label + '</span><span class="s">Encerrado</span></button>';
      }
      if (full){
        return '<button type="button" class="slot full" disabled><span class="t">' + label + '</span><span class="s">' + (capacity>1?'Completo':'Reservado') + '</span></button>';
      }
      var statusText = capacity>1 ? ((capacity-count) + ' vaga' + ((capacity-count)!==1?'s':'')) : 'Disponível';
      return '<button type="button" class="slot avail" data-slot="' + slotKey + '"><span class="t">' + label + '</span><span class="s">' + statusText + '</span></button>';
    }).join('');
    return '<div class="slot-grid">' + cells + '</div>';
  }

  function renderModal(){
    if (!ui.modalSlot) return '';
    var parts = ui.modalSlot.split('|');
    var d = parseKey(parts[0]);
    var label = WEEKDAYS_FULL[d.getDay()] + ', ' + pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + ' às ' + parts[1] + ':00';
    return '<div class="overlay" id="bookingOverlay">' +
      '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
        '<h2 id="modalTitle">Reservar horário</h2>' +
        '<p class="modal-slot-label">' + escapeHtml(label) + '</p>' +
        '<form id="bookingForm" novalidate>' +
          '<label class="field">Nome<input type="text" name="fullName" maxlength="80" autocomplete="name" required></label>' +
          '<label class="field">Telefone / WhatsApp<input type="tel" name="phone" maxlength="20" autocomplete="tel" inputmode="tel" placeholder="(11) 91234-5678" required></label>' +
          '<p class="field-error" id="formError"></p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn ghost" id="modalCancel">Cancelar</button>' +
            '<button type="submit" class="btn primary" id="modalSubmit">Confirmar</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function renderHoursGrid(){
    var active = STATE.config.activeHours || [];
    var cells = [];
    for (var h=0; h<24; h++){
      var on = active.indexOf(h) !== -1;
      cells.push('<label class="hour-check' + (on?' on':'') + '"><input type="checkbox" data-hour="' + h + '" ' + (on?'checked':'') + '>' + pad2(h) + '</label>');
    }
    return '<div class="hours-grid">' + cells.join('') + '</div>';
  }

  function renderBookingsList(){
    if (!ui.adminBookings){
      return '<p class="no-bookings">Carregando agendamentos...</p>';
    }
    var keys = Object.keys(ui.adminBookings);
    if (!keys.length) return '<p class="no-bookings">Ainda não há agendamentos.</p>';
    var byDay = {};
    keys.forEach(function(k){
      var parts = k.split('|');
      byDay[parts[0]] = byDay[parts[0]] || [];
      (ui.adminBookings[k]||[]).forEach(function(b){
        byDay[parts[0]].push({ hour: parts[1], id: b.id, name: b.name, phone: b.phone, key: k });
      });
    });
    return Object.keys(byDay).sort().map(function(dk){
      var d = parseKey(dk);
      var label = WEEKDAYS[d.getDay()] + ' ' + pad2(d.getDate()) + '/' + pad2(d.getMonth()+1);
      var rows = byDay[dk].sort(function(a,b){ return a.hour.localeCompare(b.hour); }).map(function(b){
        return '<div class="booking-row"><span class="time">' + b.hour + ':00</span>' +
          '<span class="who"><span>' + escapeHtml(b.name) + '</span><a href="tel:' + escapeHtml(b.phone) + '">' + escapeHtml(b.phone) + '</a></span>' +
          '<button type="button" class="close-x" title="Remover agendamento" data-remove-key="' + b.key + '" data-remove-id="' + b.id + '">×</button></div>';
      }).join('');
      return '<div class="booking-day"><strong>' + label + '</strong>' + rows + '</div>';
    }).join('');
  }

  function renderAdminDrawer(){
    if (!ui.adminOpen) return '';
    var inner;
    if (!ui.adminAuthed){
      inner = '<h2>Área da secretaria<button type="button" class="close-x" id="adminClose">×</button></h2>' +
        '<form id="loginForm" class="login-box">' +
          '<label class="field">Senha<input type="password" name="password" required autofocus></label>' +
          '<p class="field-error" id="loginError"></p>' +
          '<button type="submit" class="btn primary block">Entrar</button>' +
        '</form>';
    } else {
      var cfg = STATE.config;
      var totalBookings = ui.adminBookings ? Object.keys(ui.adminBookings).reduce(function(s,k){return s+ui.adminBookings[k].length;},0) : '...';
      inner = '<h2>Painel da secretaria<button type="button" class="close-x" id="adminClose">×</button></h2>' +
        '<form id="configForm">' +
          '<h3>Dados da página</h3>' +
          '<label class="field">Nome da igreja/paróquia<input type="text" name="churchName" value="' + escapeHtml(cfg.churchName) + '" required></label>' +
          '<label class="field">Subtítulo<input type="text" name="subtitle" value="' + escapeHtml(cfg.subtitle) + '"></label>' +
          '<label class="field">Telefone de contato (opcional)<input type="tel" name="contactPhone" value="' + escapeHtml(cfg.contactPhone||'') + '"></label>' +

          '<h3>Período de agendamento</h3>' +
          '<label class="field">Data inicial<input type="date" name="startDate" value="' + cfg.startDate + '" required></label>' +
          '<label class="field">Data final<input type="date" name="endDate" value="' + cfg.endDate + '" required></label>' +
          '<p class="field-error" id="dateError"></p>' +

          '<h3>Horários habilitados</h3>' +
          '<div class="row-actions">' +
            '<button type="button" class="btn ghost small" id="hoursAll">Marcar todas</button>' +
            '<button type="button" class="btn ghost small" id="hoursNone">Desmarcar todas</button>' +
          '</div>' +
          renderHoursGrid() +

          '<h3>Vagas por horário</h3>' +
          '<label class="field">Quantidade de pessoas por horário<input type="number" name="capacity" min="1" max="20" value="' + cfg.capacity + '" required></label>' +

          '<button type="submit" class="btn primary block" style="margin-top:1rem;">Salvar alterações</button>' +
        '</form>' +

        '<h3>Trocar senha da secretaria</h3>' +
        '<form id="passwordForm">' +
          '<label class="field">Nova senha<input type="password" name="pw1" minlength="4" required></label>' +
          '<label class="field">Confirmar nova senha<input type="password" name="pw2" minlength="4" required></label>' +
          '<p class="field-error" id="pwError"></p>' +
          '<button type="submit" class="btn ghost block">Atualizar senha</button>' +
        '</form>' +

        '<h3>Agendamentos (' + totalBookings + ')</h3>' +
        '<div class="row-actions"><button type="button" class="btn ghost small" id="exportCsv">Exportar CSV</button></div>' +
        renderBookingsList() +
        '<p class="drawer-note"><button type="button" class="btn ghost small" id="adminLogout">Sair</button></p>';
    }
    return '<div class="drawer-overlay" id="adminOverlay"></div><aside class="drawer" id="adminDrawer">' + inner + '</aside>';
  }

  function render(){
    var app = document.getElementById('app');
    if (!STATE.loaded){
      app.innerHTML = STATE.loadError
        ? '<p class="empty-state">Não foi possível carregar a página. Verifique sua conexão e recarregue.</p>'
        : '<p class="empty-state">Carregando...</p>';
      return;
    }
    var days = listDays();
    var todayD = now();
    if (!ui.selectedDay || !days.some(function(d){ return toKey(d)===ui.selectedDay; })){
      var startOfToday = new Date(todayD.getFullYear(),todayD.getMonth(),todayD.getDate());
      var future = days.find(function(d){ return d >= startOfToday; });
      ui.selectedDay = toKey(future || days[days.length-1] || todayD);
    }
    var selectedDate = days.find(function(d){ return toKey(d)===ui.selectedDay; }) || todayD;

    var html = '';
    html += '<header class="hero"><div class="hero-inner">' +
      '<p class="eyebrow">Adoração Eucarística</p>' +
      '<h1>' + escapeHtml(STATE.config.churchName) + '</h1>' +
      '<p class="subtitle">' + escapeHtml(STATE.config.subtitle) + '</p>' +
    '</div></header>';

    html += '<main class="wrap">';
    html += '<div class="legend"><span><i class="avail"></i>Disponível</span><span><i class="full"></i>Reservado</span><span><i class="closed"></i>Encerrado</span></div>';
    if (!days.length){
      html += '<p class="empty-state">Nenhum período de agendamento configurado no momento.</p>';
    } else {
      html += renderDayStrip(days, todayD);
      html += '<p class="day-heading">' + WEEKDAYS_FULL[selectedDate.getDay()] + ', ' + pad2(selectedDate.getDate()) + '/' + pad2(selectedDate.getMonth()+1) + '</p>';
      html += renderSlotGrid(selectedDate, todayD);
    }
    html += '</main>';

    html += '<footer class="site-footer"><span>' + escapeHtml(STATE.config.churchName) + '</span></footer>';
    html += '<button type="button" class="admin-trigger font-ui" id="adminTrigger" aria-label="Área da secretaria">⚙</button>';
    html += renderModal();
    html += renderAdminDrawer();
    html += '<div class="toast" id="toast" hidden></div>';

    app.innerHTML = html;
  }

  // ---------------- event delegation ----------------
  document.body.addEventListener('click', function(e){
    var dayBtn = e.target.closest('.day-chip');
    if (dayBtn){ ui.selectedDay = dayBtn.getAttribute('data-day'); render(); return; }

    var slotBtn = e.target.closest('.slot.avail');
    if (slotBtn){ ui.modalSlot = slotBtn.getAttribute('data-slot'); render(); var inp = document.querySelector('#bookingForm input[name=fullName]'); if(inp) inp.focus(); return; }

    if (e.target.closest('#modalCancel') || e.target.id === 'bookingOverlay'){
      ui.modalSlot = null; render(); return;
    }

    if (e.target.closest('#adminTrigger')){
      ui.adminOpen = true;
      render();
      if (ui.adminAuthed) fetchAdminBookings();
      return;
    }
    if (e.target.closest('#adminClose') || e.target.id === 'adminOverlay'){ ui.adminOpen = false; render(); return; }
    if (e.target.closest('#adminLogout')){
      ui.adminAuthed = false; ui.token = null; ui.adminBookings = null;
      sessionStorage.removeItem('admToken');
      render();
      return;
    }

    if (e.target.closest('#hoursAll')){
      document.querySelectorAll('.hour-check input').forEach(function(cb){ cb.checked = true; cb.closest('.hour-check').classList.add('on'); });
      return;
    }
    if (e.target.closest('#hoursNone')){
      document.querySelectorAll('.hour-check input').forEach(function(cb){ cb.checked = false; cb.closest('.hour-check').classList.remove('on'); });
      return;
    }

    var rem = e.target.closest('[data-remove-key]');
    if (rem){
      if (ui.busy) return;
      ui.busy = true;
      var slotKey = rem.getAttribute('data-remove-key');
      var bookingId = rem.getAttribute('data-remove-id');
      api('/api/admin/remove-booking', { token: ui.token, slotKey: slotKey, bookingId: bookingId }).then(function(res){
        ui.busy = false;
        if (res.status === 401){ forceLogout('Sessão expirada. Entre novamente.'); return; }
        if (!res.data.ok){ toast('Não foi possível remover.'); return; }
        toast('Agendamento removido.');
        Promise.all([loadState(), fetchAdminBookings()]);
      }).catch(function(){ ui.busy = false; toast('Erro de conexão. Tente novamente.'); });
      return;
    }

    if (e.target.closest('#exportCsv')){
      if (!ui.adminBookings){ toast('Aguarde os agendamentos carregarem.'); return; }
      var rows = [['Data','Hora','Nome','Telefone']];
      Object.keys(ui.adminBookings).sort().forEach(function(k){
        var parts = k.split('|');
        (ui.adminBookings[k]||[]).forEach(function(b){ rows.push([parts[0], parts[1]+':00', b.name, b.phone]); });
      });
      var csv = '﻿' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(';'); }).join('\r\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'agendamentos.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      return;
    }
  });

  function forceLogout(msg){
    ui.adminAuthed = false; ui.token = null; ui.adminBookings = null;
    sessionStorage.removeItem('admToken');
    render();
    if (msg) toast(msg);
  }

  function fetchAdminBookings(){
    return api('/api/admin/bookings', { token: ui.token }).then(function(res){
      if (res.status === 401){ forceLogout('Sessão expirada. Entre novamente.'); return; }
      ui.adminBookings = res.data.bookings || {};
      if (ui.adminOpen) render();
    }).catch(function(){ /* keep silent, list stays in loading state */ });
  }

  document.body.addEventListener('input', function(e){
    if (e.target.name === 'phone' && e.target.closest('#bookingForm')){
      e.target.value = maskPhone(e.target.value);
    }
    if (e.target.closest('.hour-check input')){
      e.target.closest('.hour-check').classList.toggle('on', e.target.checked);
    }
  });

  document.body.addEventListener('submit', function(e){
    if (e.target.id === 'bookingForm'){
      e.preventDefault();
      if (ui.busy) return;
      var form = e.target;
      var name = fv(form,'fullName').trim();
      var phone = fv(form,'phone').trim();
      var err = document.getElementById('formError');
      var digits = phone.replace(/\D/g,'');
      if (name.length < 3){ err.textContent = 'Informe seu nome completo.'; err.classList.add('show'); return; }
      if (digits.length < 8){ err.textContent = 'Informe um telefone válido com DDD.'; err.classList.add('show'); return; }
      err.classList.remove('show');

      ui.busy = true;
      var btn = document.getElementById('modalSubmit');
      if (btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }
      var slotKey = ui.modalSlot;

      api('/api/book', { slotKey: slotKey, name: name, phone: phone }).then(function(res){
        ui.busy = false;
        if (res.data.ok){
          ui.modalSlot = null;
          toast('Horário reservado com sucesso!');
          loadState();
          return;
        }
        var messages = {
          full: 'Esse horário acabou de ficar completo. Escolha outro.',
          out_of_range: 'Esse horário não está mais disponível para agendamento.',
          hour_closed: 'Esse horário não está habilitado.',
          past: 'Esse horário já passou.',
          bad_name: 'Informe seu nome completo.',
          bad_phone: 'Informe um telefone válido.'
        };
        err.textContent = messages[res.data.reason] || 'Não foi possível confirmar agora. Tente novamente.';
        err.classList.add('show');
        if (btn){ btn.disabled = false; btn.textContent = 'Confirmar'; }
        if (res.data.reason === 'full' || res.data.reason === 'out_of_range' || res.data.reason === 'hour_closed' || res.data.reason === 'past'){
          loadState();
        }
      }).catch(function(){
        ui.busy = false;
        if (btn){ btn.disabled = false; btn.textContent = 'Confirmar'; }
        err.textContent = 'Erro de conexão. Tente novamente.';
        err.classList.add('show');
      });
      return;
    }

    if (e.target.id === 'loginForm'){
      e.preventDefault();
      var pw = fv(e.target,'password');
      api('/api/admin/login', { password: pw }).then(function(res){
        if (res.data.ok){
          ui.token = res.data.token;
          ui.adminAuthed = true;
          sessionStorage.setItem('admToken', ui.token);
          render();
          fetchAdminBookings();
        } else {
          var le = document.getElementById('loginError');
          le.textContent = 'Senha incorreta.';
          le.classList.add('show');
        }
      }).catch(function(){
        var le2 = document.getElementById('loginError');
        le2.textContent = 'Erro de conexão. Tente novamente.';
        le2.classList.add('show');
      });
      return;
    }

    if (e.target.id === 'configForm'){
      e.preventDefault();
      var f = e.target;
      var startDate = fv(f,'startDate'), endDate = fv(f,'endDate');
      var de = document.getElementById('dateError');
      if (!startDate || !endDate || endDate < startDate){
        de.textContent = 'A data final precisa ser igual ou depois da data inicial.';
        de.classList.add('show');
        return;
      }
      de.classList.remove('show');
      var hours = Array.prototype.slice.call(document.querySelectorAll('.hour-check input:checked')).map(function(cb){ return Number(cb.getAttribute('data-hour')); });
      var patch = {
        churchName: fv(f,'churchName').trim(),
        subtitle: fv(f,'subtitle').trim(),
        contactPhone: fv(f,'contactPhone').trim(),
        startDate: startDate,
        endDate: endDate,
        activeHours: hours,
        capacity: Number(fv(f,'capacity')) || 1
      };
      api('/api/admin/config', { token: ui.token, patch: patch }).then(function(res){
        if (res.status === 401){ forceLogout('Sessão expirada. Entre novamente.'); return; }
        if (!res.data.ok){ toast('Não foi possível salvar.'); return; }
        toast('Alterações salvas.');
        loadState();
      }).catch(function(){ toast('Erro de conexão. Tente novamente.'); });
      return;
    }

    if (e.target.id === 'passwordForm'){
      e.preventDefault();
      var f2 = e.target;
      var pe = document.getElementById('pwError');
      var pw1 = fv(f2,'pw1'), pw2 = fv(f2,'pw2');
      if (pw1.length < 4){ pe.textContent = 'A senha precisa ter ao menos 4 caracteres.'; pe.classList.add('show'); return; }
      if (pw1 !== pw2){ pe.textContent = 'As senhas não coincidem.'; pe.classList.add('show'); return; }
      pe.classList.remove('show');
      api('/api/admin/password', { token: ui.token, newPassword: pw1 }).then(function(res){
        if (res.status === 401){ forceLogout('Sessão expirada. Entre novamente.'); return; }
        if (!res.data.ok){ pe.textContent = 'Não foi possível atualizar.'; pe.classList.add('show'); return; }
        toast('Senha atualizada.');
        f2.reset();
      }).catch(function(){ pe.textContent = 'Erro de conexão.'; pe.classList.add('show'); });
      return;
    }
  });

  document.body.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if (ui.modalSlot){ ui.modalSlot = null; render(); }
      else if (ui.adminOpen){ ui.adminOpen = false; render(); }
    }
  });

  // ---------------- init ----------------
  render();
  loadState();
})();
</script>
</body>
</html>
